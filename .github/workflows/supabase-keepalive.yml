name: Supabase keepalive

# Free Supabase projects are paused after 7 days without activity, which would
# stop the match archive (see docs/archive-schema.sql) from being read. Supabase
# says "a few requests a day" is usually enough to count as activity (a read
# twice a week was not), so a small read runs every 6 hours. A failed run is
# reported by GitHub in the usual way (e.g. by email).
# See https://supabase.com/kb/faqs/platform/free-project-pausing
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17 and 18:17 UTC daily
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the match archive
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "VITE_SUPABASE_URL variable is not set"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "VITE_SUPABASE_PUBLISHABLE_KEY variable is not set"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/matches?select=id&limit=1"
